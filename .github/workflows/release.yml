name: Release
on:
  push:
    tags: ['v*']

jobs:
  # Gate: run the full E2E suite against the tagged commit before publishing
  # anything. If the real-Chromium ↔ real-MCP-server contract is broken, we
  # do NOT want artifacts on GitHub Releases.
  e2e-gate:
    runs-on: ubuntu-latest
    env:
      CHROMANCHE_E2E: "1"
      # Paste tests write the system clipboard — fine on a throwaway CI
      # display (xvfb), never by default on a developer's machine.
      CHROMANCHE_E2E_CLIPBOARD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -F @chromanche/extension exec playwright install --with-deps chromium

      - name: run e2e under xvfb
        run: xvfb-run -a pnpm -F @chromanche/extension test:integration

      - name: upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts-${{ github.ref_name }}
          path: |
            packages/extension/test-results
            packages/extension/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: e2e-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @chromanche/shared build
      - run: pnpm -F @chromanche/mcp-server build
      - run: pnpm -F @chromanche/extension build

      - name: package extension
        run: |
          cd packages/extension/dist
          zip -r "${{ github.workspace }}/chromanche-extension-${{ github.ref_name }}.zip" .

      - name: package mcp-server
        run: |
          cd packages/mcp-server
          tar -czf "${{ github.workspace }}/chromanche-mcp-server-${{ github.ref_name }}.tgz" \
            dist package.json README.md 2>/dev/null || \
          tar -czf "${{ github.workspace }}/chromanche-mcp-server-${{ github.ref_name }}.tgz" \
            dist package.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            chromanche-extension-*.zip
            chromanche-mcp-server-*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags with a hyphen are semver pre-releases (e.g. v0.10.0-rc.1,
          # v0.10.0-dev.2) — mark them on GitHub so 'Latest release' keeps
          # pointing at the most recent stable tag. Tag a hyphen-free tag
          # (e.g. v0.10.0) when the dev/rc passes review on test machines.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') == false }}
